apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sourceos-build-smoke-runner-image
spec:
  description: >-
    Build, optionally publish, generate SBOM, and optionally sign the SourceOS
    smoke-runner image used by live ISO smoke checks.
  params:
    - name: imageRef
      type: string
      default: quay.io/socios/sourceos-smoke-runner:dev
    - name: baseImage
      type: string
      default: registry.fedoraproject.org/fedora-minimal@sha256:REPLACE_WITH_VERIFIED_DIGEST
    - name: requirePinnedBase
      type: string
      default: "true"
    - name: push
      type: string
      default: "false"
    - name: sign
      type: string
      default: "false"
    - name: builderImage
      type: string
      default: quay.io/buildah/stable:latest
    - name: sbomImage
      type: string
      default: anchore/syft:latest
    - name: signingImage
      type: string
      default: gcr.io/projectsigstore/cosign:latest
  workspaces:
    - name: source
  tasks:
    - name: build-smoke-runner-image
      taskRef:
        name: build-smoke-runner-image
      workspaces:
        - name: source
          workspace: source
      params:
        - name: imageRef
          value: $(params.imageRef)
        - name: baseImage
          value: $(params.baseImage)
        - name: requirePinnedBase
          value: $(params.requirePinnedBase)
        - name: push
          value: $(params.push)
        - name: builderImage
          value: $(params.builderImage)

    - name: sbom-smoke-runner-image
      runAfter: [build-smoke-runner-image]
      taskRef:
        name: sbom-smoke-runner-image
      workspaces:
        - name: source
          workspace: source
      params:
        - name: imageRef
          value: $(params.imageRef)
        - name: sbomImage
          value: $(params.sbomImage)

    - name: sign-smoke-runner-image
      runAfter: [sbom-smoke-runner-image]
      taskRef:
        name: sign-smoke-runner-image
      workspaces:
        - name: source
          workspace: source
      params:
        - name: imageRef
          value: $(params.imageRef)
        - name: enabled
          value: $(params.sign)
        - name: signingImage
          value: $(params.signingImage)
