apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: smoke-live-iso
spec:
  description: >-
    Smoke-check a customized FCOS/SourceOS live ISO with the repo-local smoke
    runner and emit a JSON receipt.
  params:
    - name: runnerImage
      type: string
      description: Image containing Python and required runtime tooling.
      default: quay.io/socios/sourceos-smoke-runner:latest
    - name: isoPath
      type: string
      description: Path to the ISO to smoke-check.
    - name: outDir
      type: string
      description: Directory for smoke-check logs and receipt.
      default: .workstation/state/smoke/sourceos-live-iso
  workspaces:
    - name: source
      description: Workspace containing the built ISO and checked-out socios repo.
  steps:
    - name: smoke
      image: $(params.runnerImage)
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail
        echo "[smoke-live-iso] checking ISO: $(params.isoPath)"
        test -f "$(params.isoPath)"
        test -f ./tools/sourceos-smoke-runner
        python3 ./tools/sourceos-smoke-runner --iso "$(params.isoPath)" --out-dir "$(params.outDir)"
